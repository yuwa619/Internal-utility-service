# =============================================================================
# Nginx Reverse Proxy Configuration — Internal Utility Service
#
# Deployment notes:
#   • Copy this file to /etc/nginx/sites-available/internal-utility-service
#   • Create a symlink: ln -s /etc/nginx/sites-available/internal-utility-service
#                                /etc/nginx/sites-enabled/
#   • Replace YOUR_DOMAIN_OR_IP with the EC2 public domain / IP
#   • After obtaining Let's Encrypt certs (see README), uncomment the HTTPS
#     server block and reload Nginx: sudo nginx -s reload
#
# Blue-green port convention used by deploy.sh:
#   Blue  → 127.0.0.1:5001
#   Green → 127.0.0.1:5002
#   The active port is written to /opt/internal-utility-service/ACTIVE_PORT
#   and deploy.sh updates the upstream directive and reloads Nginx.
# =============================================================================

# ── Upstream ─────────────────────────────────────────────────────────────────
# deploy.sh rewrites this file's port number and runs `nginx -s reload`.
upstream app {
    server 127.0.0.1:5001;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Let's Encrypt ACME challenge — must be reachable over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: hard redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
# Uncomment this block after running Certbot:
#   sudo certbot --nginx -d YOUR_DOMAIN_OR_IP
#
server {
    listen 443 ssl;
    server_name YOUR_DOMAIN_OR_IP;

    # --- SSL certificates (managed by Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_OR_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_OR_IP/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           DENY                                  always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "no-referrer-when-downgrade"          always;

    # --- Proxy to Flask/Gunicorn ---
    location / {
        proxy_pass         http://app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --- Health check (Nginx-level) — suppress access logs for monitors ---
    location /health {
        proxy_pass         http://app/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }
}
