# nginx-bootstrap.conf — Initial HTTP-only config used on first deploy.
# Certbot will later add SSL and rewrite this file for HTTPS.
# This file is copied to /etc/nginx/nginx.conf by the CI deploy step.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Blue-green upstream — deploy.sh rewrites this port on every release
    upstream app {
        server 127.0.0.1:5001;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options       DENY    always;
        add_header X-Content-Type-Options nosniff always;

        location / {
            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /health {
            proxy_pass http://app/health;
            access_log off;
        }
    }
}
