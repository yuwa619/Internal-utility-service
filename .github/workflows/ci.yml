# =============================================================================
# CI/CD Pipeline — Internal Utility Service
#
# Jobs:
#   1. test    — lint (flake8) + unit tests (pytest)  [all branches / PRs]
#   2. build   — multi-stage Docker build + push to Docker Hub  [main only]
#   3. deploy  — SSH into EC2 and run blue-green deploy script  [main only]
#
# Required GitHub Secrets:
#   DOCKERHUB_USERNAME   Docker Hub account username
#   DOCKERHUB_TOKEN      Docker Hub access token (not your password)
#   EC2_HOST             Public IP or hostname of the EC2 instance
#   EC2_USERNAME         SSH user on EC2 (e.g. ubuntu or ec2-user)
#   EC2_SSH_KEY          Private SSH key for EC2 access (PEM contents)
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Test
  # Run on every push and every pull-request targeting main.
  # The build job only runs when this job succeeds.
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 . --max-line-length=88 \
            --exclude=.git,__pycache__,venv,env,.venv

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Job 2: Build & Push
  # Runs only on pushes to main (not on PRs) and only after tests pass.
  # Produces three tags for every release:
  #   latest          — always points to the most recent main build
  #   v1.0.0          — semantic version (update when tagging a release)
  #   sha-<short-sha> — immutable reference tied to this exact commit
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Compute short SHA tag
        id: meta
        run: echo "short_sha=sha-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/internal-utility-service:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/internal-utility-service:v1.0.0 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/internal-utility-service:${{ steps.meta.outputs.short_sha }} \
            .

      - name: Push Docker image
        # Three tags per build — see tagging strategy in README
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/internal-utility-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/internal-utility-service:v1.0.0
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/internal-utility-service:${{ steps.meta.outputs.short_sha }}

  # ---------------------------------------------------------------------------
  # Job 3: Deploy
  # SSH into the EC2 instance.  The deploy script implements blue-green logic:
  # it pulls the new image, starts the inactive colour, waits for the health
  # check, then swaps Nginx upstream and stops the old container.
  # Secrets are never echoed to the log.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # ── Detect OS (Ubuntu vs Amazon Linux) ───────────────────────────
            OS_ID=$(. /etc/os-release && echo "$ID")

            pkg_install() {
              if [[ "$OS_ID" == "amzn" ]]; then
                sudo yum install -y "$@"
              else
                sudo apt-get update -y && sudo apt-get install -y "$@"
              fi
            }

            # ── Install Docker if not present ────────────────────────────────
            if ! command -v docker &> /dev/null; then
              if [[ "$OS_ID" == "amzn" ]]; then
                sudo yum install -y docker
              else
                curl -fsSL https://get.docker.com | sudo sh
              fi
              sudo systemctl enable docker
              sudo systemctl start docker
              sudo usermod -aG docker "$USER"
            fi

            # ── Install Nginx if not present ─────────────────────────────────
            if ! command -v nginx &> /dev/null; then
              pkg_install nginx
              sudo systemctl enable nginx
              sudo systemctl start nginx
            fi

            # ── Install Git if not present ───────────────────────────────────
            command -v git &> /dev/null || pkg_install git

            # ── Clone repo on first deploy, pull on subsequent deploys ───────
            if [ ! -d /opt/internal-utility-service ]; then
              sudo git clone https://github.com/yuwa619/Internal-utility-service.git \
                /opt/internal-utility-service
              sudo chown -R "$USER":"$USER" /opt/internal-utility-service
            fi

            cd /opt/internal-utility-service
            git fetch origin main
            git reset --hard origin/main

            # ── Write minimal HTTP-only Nginx config (no SSL yet) ────────────
            # nginx-bootstrap.conf is a complete nginx.conf replacement with
            # proper http{} wrapper. Certbot adds SSL later.
            # Only copy on first deploy (guard: upstream block not yet present).
            if ! sudo grep -q "upstream app" /etc/nginx/nginx.conf 2>/dev/null; then
              sudo cp /opt/internal-utility-service/nginx/nginx-bootstrap.conf \
                /etc/nginx/nginx.conf
              sudo nginx -t && sudo systemctl reload nginx
            fi

            # ── Ensure .env exists ────────────────────────────────────────────
            [ -f .env ] || cp .env.example .env

            # ── Run blue-green deploy ─────────────────────────────────────────
            chmod +x scripts/deploy.sh
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
              bash scripts/deploy.sh
