# =============================================================================
# docker-compose.yml — Local Development Stack
#
# Usage:
#   cp .env.example .env          # fill in your local values
#   docker compose up --build     # start app + nginx
#   docker compose down           # tear down
#
# NOTE: HTTPS is not enabled locally.  The nginx service proxies plain HTTP
#       on port 80 → app:5000.  For HTTPS, use the EC2 + Certbot setup
#       described in the README.
# =============================================================================

version: "3.9"

services:
  # --------------------------------------------------------------------------
  # Application container
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      target: production       # use the final stage of the multi-stage build
    image: internal-utility-service:local
    container_name: internal-utility-app
    restart: unless-stopped
    env_file:
      - .env                   # secrets live here, never in the image
    environment:
      - ENVIRONMENT=development
    expose:
      - "5000"                 # only reachable by nginx, not the host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - app-net

  # --------------------------------------------------------------------------
  # Nginx reverse proxy
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: internal-utility-nginx
    restart: unless-stopped
    ports:
      - "80:80"                # expose HTTP to the host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
